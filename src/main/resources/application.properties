spring.application.name=ecocheck-springboot-service
server.servlet.context-path=/ecocheck

spring.datasource.url=jdbc:mysql://localhost:3306/ecocheck_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.continue-on-error=true

app.jwt.secret=EcoCheckBackendJwtSecretKeyForAssignmentOnlyChangeLater2026
app.jwt.expiration-seconds=7200

